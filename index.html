<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Ability</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        h1 { font-size: 42px; color: #fff; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 16px; margin-bottom: 50px; }
        .links { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
        a {
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; background: #161b22;
            border: 2px solid #2d333b; border-radius: 20px;
            padding: 40px 36px; transition: all 0.2s;
            width: 280px;
        }
        a:hover { border-color: #FFD700; transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
        .icon { font-size: 48px; margin-bottom: 16px; }
        .link-title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .link-desc { font-size: 13px; color: #888; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>
    <h1>Vision Ability</h1>
    <p class="subtitle">Accessibility app for visually impaired people</p>
    <div class="links">
        <a href="mockups/mockup.html">
            <span class="icon">📱</span>
            <span class="link-title">Static Mockups</span>
            <span class="link-desc">6 screens showing app layout: Navigation, NHS WebView, Settings</span>
        </a>
        <a href="mockups/prototype.html">
            <span class="icon">🖱️</span>
            <span class="link-title">Interactive Prototype</span>
            <span class="link-desc">Clickable 7-screen prototype with NHS WebView flow &amp; voice overlay</span>
        </a>
    </div>
</body>
</html>
